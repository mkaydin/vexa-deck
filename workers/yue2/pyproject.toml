[project]
name = "vexa-yue2-worker"
version = "0.1.0"
description = "Background music generation over pluggable backends, with analysis and quality gates"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vexa-contracts",
    "pydantic>=2.9",
]

[project.optional-dependencies]
analysis = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
]
# Only the torch backend needs this. The GGUF backends are external C++ binaries.
torch = [
    "torch>=2.14",
    "transformers>=5.18",
    "diffusers>=0.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexa_yue2"]