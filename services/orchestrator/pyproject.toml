[project]
name = "vexa-orchestrator"
version = "0.1.0"
description = "Deterministic control plane: feasibility filter, rule policy, scheduler, request state machine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vexa-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexa_orchestrator"]