[project]
name = "vexa-planner"
version = "0.1.0"
description = "OpenAI-compatible intent planner with a local rule-based fallback"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vexa-contracts",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexa_planner"]