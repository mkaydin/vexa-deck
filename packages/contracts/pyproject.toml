[project]
name = "vexa-contracts"
version = "0.1.0"
description = "Versioned event and schema contracts shared by every VEXA//DECK component"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexa_contracts"]